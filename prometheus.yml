global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'node-backend'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['backend:5000']

  - job_name: 'ai-services'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['ai-services:8000']
