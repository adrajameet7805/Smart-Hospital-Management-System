version: '3.8'

services:
  # ============================================
  # PostgreSQL Database
  # ============================================
  postgres:
    image: postgres:16-alpine
    container_name: hospital-postgres
    environment:
      POSTGRES_DB: smart_hospital
      POSTGRES_USER: hospital_admin
      # ⚠️ INSECURE: Replace with Docker Secrets or .env file before any deployment
      POSTGRES_PASSWORD: ${DB_PASSWORD:-securepass123}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hospital_admin -d smart_hospital"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ============================================
  # Redis Cache
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: hospital-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  # ============================================
  # Node.js Backend API
  # ============================================
  backend:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    container_name: hospital-backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=development
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=smart_hospital
      - DB_USER=hospital_admin
      - DB_PASSWORD=${DB_PASSWORD:-securepass123}
      - REDIS_URL=redis://redis:6379
      # ⚠️ INSECURE: Replace with Docker Secrets before any deployment
      - JWT_SECRET=${JWT_SECRET:-smart-hospital-jwt-secret-2026}
      - JWT_EXPIRES_IN=15m
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost,http://localhost:5173}
      # REMOVED: CORS_ORIGIN=http://localhost:5173 (was causing login CORS failure)
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ============================================
  # Python AI Services
  # ============================================
  ai-services:
    build:
      context: ./ai-services
      dockerfile: Dockerfile
    container_name: hospital-ai
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=smart_hospital
      - DB_USER=hospital_admin
      - DB_PASSWORD=${DB_PASSWORD:-securepass123}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # ============================================
  # React Frontend (Vite Dev Server)
  # ============================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hospital-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost/api/v1
      - VITE_AI_URL=http://localhost/api/ai
    depends_on:
      - backend
    restart: unless-stopped

  # ============================================
  # Nginx Reverse Proxy
  # ============================================
  nginx:
    build:
      context: .
      dockerfile: ./nginx/Dockerfile
    container_name: hospital-nginx
    ports:
      - "80:80"
    depends_on:
      - backend
      - ai-services
      - frontend
    restart: unless-stopped

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local
