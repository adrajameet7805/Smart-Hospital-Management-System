worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    client_max_body_size 50M;

    # Logging
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    # ── Rate limiting ONLY for AI routes ──────────
    limit_req_zone $binary_remote_addr zone=ai_limit:10m rate=10r/m;

    server {
        listen 80;
        server_name localhost;

        # ── Frontend (React/Vite) ─────────────────
        location / {
            proxy_pass http://frontend:5173;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Vite HMR WebSocket support
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 86400;
        }

        # ── Backend REST API (NO rate limit) ──────
        # Auth routes MUST NOT be rate limited in dev
        location /api/v1/ {
            proxy_pass http://backend:5000/api/v1/;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout    60s;
            proxy_connect_timeout 10s;
            proxy_send_timeout    60s;
        }

        # ── AI Service (RATE LIMITED) ─────────────
        location /api/ai/ {
            limit_req zone=ai_limit burst=5 nodelay;
            limit_req_status 429;
            proxy_pass http://ai-services:8000/;
            proxy_http_version 1.1;
            proxy_set_header Host            $host;
            proxy_set_header X-Real-IP       $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 120s;
        }

        # ── Socket.io WebSocket ───────────────────
        location /socket.io/ {
            proxy_pass http://backend:5000/socket.io/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host       $host;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 86400;
        }

        # ── Health Check ──────────────────────────
        location /health {
            access_log off;
            return 200 '{"status":"nginx-ok","timestamp":"$time_iso8601"}';
            add_header Content-Type application/json;
        }

        # ── Custom Error Pages ────────────────────
        error_page 429 /429.json;
        location = /429.json {
            internal;
            return 429 '{"error":"Too many requests. Please wait before retrying.","code":"RATE_LIMIT_EXCEEDED"}';
            add_header Content-Type application/json always;
        }

        error_page 502 503 504 /50x.json;
        location = /50x.json {
            internal;
            return 502 '{"error":"Service temporarily unavailable. Please try again.","code":"SERVICE_DOWN"}';
            add_header Content-Type application/json always;
        }
    }
}
