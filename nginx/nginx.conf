worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # Rate limit ONLY for AI — 10 req/min per IP
    limit_req_zone $binary_remote_addr zone=ai_limit:10m rate=10r/m;

    server {
        listen 80;
        server_name localhost;

        # Frontend (Vite dev server)
        location / {
            proxy_pass http://frontend:5173;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # Backend API — NO rate limiting on auth routes
        location /api/v1/ {
            proxy_pass http://backend:5000/api/v1/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 60s;
            proxy_connect_timeout 10s;
        }

        # AI Service — RATE LIMITED
        location /api/ai/ {
            limit_req zone=ai_limit burst=5 nodelay;
            limit_req_status 429;
            proxy_pass http://ai-services:8000/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Socket.io WebSocket
        location /socket.io/ {
            proxy_pass http://backend:5000/socket.io/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }

        # Health check endpoint
        location /health {
            return 200 '{"status":"nginx-ok"}';
            add_header Content-Type application/json;
        }

        # Custom error for rate limit
        error_page 429 /429.json;
        location = /429.json {
            return 429 '{"error":"Too many requests. Please wait and try again."}';
            add_header Content-Type application/json;
        }

        # Custom error for upstream failures
        error_page 502 503 504 /50x.json;
        location = /50x.json {
            return 502 '{"error":"Service temporarily unavailable."}';
            add_header Content-Type application/json;
        }
    }
}
