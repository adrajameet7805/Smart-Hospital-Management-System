worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    client_max_body_size 50M;

    # Rate limit ONLY for AI — prevents DoS on heavy ML containers
    limit_req_zone $binary_remote_addr zone=ai_limit:10m rate=10r/m;

    server {
        listen 80;
        server_name localhost;

        # ── Frontend (React/Vite dev server) ────────────
        location / {
            proxy_pass http://frontend:5173;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        "upgrade";
            proxy_read_timeout 86400;
        }

        # ── Backend REST API (NO rate limit — auth must work) ──
        location /api/v1/ {
            proxy_pass http://backend:5000/api/v1/;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout    60s;
            proxy_connect_timeout 10s;
            proxy_send_timeout    60s;
        }

        # ── AI Microservice (RATE LIMITED) ──────────────
        location /api/ai/ {
            limit_req zone=ai_limit burst=5 nodelay;
            limit_req_status 429;
            proxy_pass http://ai-services:8000/;
            proxy_http_version 1.1;
            proxy_set_header Host            $host;
            proxy_set_header X-Real-IP       $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 120s;
        }

        # ── Socket.io WebSocket ──────────────────────────
        location /socket.io/ {
            proxy_pass http://backend:5000/socket.io/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host       $host;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 86400;
        }

        # ── Health check ─────────────────────────────────
        location /health {
            access_log off;
            return 200 '{"status":"ok","service":"nginx"}';
            add_header Content-Type application/json;
        }

        # ── Custom error pages ───────────────────────────
        error_page 429 /429.json;
        location = /429.json {
            internal;
            return 429 '{"error":"Too many requests","code":"RATE_LIMIT_EXCEEDED"}';
            add_header Content-Type application/json always;
        }

        error_page 502 503 504 /50x.json;
        location = /50x.json {
            internal;
            return 502 '{"error":"Service unavailable","code":"SERVICE_DOWN"}';
            add_header Content-Type application/json always;
        }
    }
}
